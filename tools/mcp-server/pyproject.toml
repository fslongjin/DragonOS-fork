[project]
name = "dragonos-mcp"
version = "0.1.0"
description = "MCP server for DragonOS VM interaction"
requires-python = ">=3.8"
dependencies = [
    "mcp>=1.0.0",
    "psutil>=5.9.0",
    "pexpect>=4.8.0",
    "watchdog>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
dragonos-mcp = "dragonos_mcp.server:main"


